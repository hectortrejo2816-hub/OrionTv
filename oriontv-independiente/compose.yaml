services:
  oriontv:
    build: ./server
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Configura PUBLIC_URL en .env}
      ORION_DATA: /data
      MATEO_WA_ENABLED: "${MATEO_WA_ENABLED:-0}"
      MATEO_WA_APP_SECRET: "${MATEO_WA_APP_SECRET:-}"
      MATEO_WA_VERIFY_TOKEN: "${MATEO_WA_VERIFY_TOKEN:-}"
      MATEO_WA_ACCESS_TOKEN: "${MATEO_WA_ACCESS_TOKEN:-}"
      MATEO_WA_PHONE_NUMBER_ID: "${MATEO_WA_PHONE_NUMBER_ID:-}"
      MATEO_WA_GRAPH_VERSION: "${MATEO_WA_GRAPH_VERSION:-}"
      MATEO_WA_OWNER_NUMBER: "${MATEO_WA_OWNER_NUMBER:-}"
      MATEO_WA_ADMIN: "${MATEO_WA_ADMIN:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ORION_ASSISTANT_MODEL: "${ORION_ASSISTANT_MODEL:-}"
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - oriontv_data:/data

  descargas:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - /opt/oriontv-downloads:/usr/share/nginx/html/descargas:ro
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.oriontv-descargas.rule=Host(`panel.oriontv.tech`) && PathPrefix(`/descargas/`)"
      - "traefik.http.routers.oriontv-descargas.entrypoints=websecure"
      - "traefik.http.routers.oriontv-descargas.tls.certresolver=letsencrypt"
      - "traefik.http.routers.oriontv-descargas.priority=100"
      - "traefik.http.routers.oriontv-descargas.service=oriontv-descargas"
      - "traefik.http.services.oriontv-descargas.loadbalancer.server.port=80"

volumes:
  oriontv_data:

networks:
  dokploy-network:
    external: true