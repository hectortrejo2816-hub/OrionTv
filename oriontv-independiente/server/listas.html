<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrionTV · Listas del cliente</title>
<style>body{font:16px system-ui;background:#10131b;color:#fff;max-width:900px;margin:30px auto;padding:20px}a{color:#ff8ca4}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #586071;background:#202736;color:white;box-sizing:border-box;max-width:100%}input,select{width:100%}button{cursor:pointer;margin:12px 8px 0 0}button:focus,input:focus,select:focus{outline:3px solid white}fieldset{margin:18px 0;border:1px solid #586071;border-radius:10px}#message{white-space:pre-line}.primary{background:#202736;padding:16px;border-radius:10px}</style>
<a href="/">← Volver al panel</a><h1>Listas del cliente</h1><p>Asigna hasta 5 DNS por cliente, contando la lista principal. Solo verá estas listas en OrionTV.</p>
<label for="client">Cliente / código</label><select id="client"></select><p id="message" role="status"></p><div id="primary" class="primary"></div><form id="form"><div id="rows"></div><button type="button" id="add">Añadir DNS</button><button type="submit">Guardar listas</button></form>
<script>
'use strict';let data,items=[],busy=false,epoch=0,save=false;const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',...options});const b=await r.json();if(!r.ok)throw Error(typeof b.detail==='string'?b.detail:'No se pudo completar la solicitud');return b;}
function input(label,value,type='text'){const wrap=document.createElement('label');wrap.textContent=label;const el=document.createElement('input');el.type=type;el.value=value||'';el.autocomplete=type==='password'?'new-password':'off';wrap.append(el);return [wrap,el];}
function draw(){const holder=$('rows');holder.replaceChildren();items.forEach((row,index)=>{const box=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent='Lista adicional '+(index+1);box.append(legend);const label=document.createElement('label');label.textContent='DNS guardado';const select=document.createElement('select');for(const dns of data.dns){const option=document.createElement('option');option.value=dns.id;option.textContent=dns.name;select.append(option);}select.value=row.dns_id||'';select.onchange=()=>row.dns_id=select.value;label.append(select);box.append(label);
for(const [title,key,type] of [['Nombre que verá el cliente','name','text'],['Usuario del servicio','service_user','text'],[row.id?'Contraseña (vacía para conservar)':'Contraseña del servicio','service_password','password']]){const [wrap,field]=input(title,row[key],type);field.oninput=()=>row[key]=field.value;box.append(wrap);}const remove=document.createElement('button');remove.type='button';remove.textContent='Quitar lista';remove.onclick=()=>{items.splice(index,1);draw();};box.append(remove);holder.append(box);});$('add').disabled=busy||items.length>=4;}
async function load(){if(save)return;const ticket=++epoch;busy=true;$('add').disabled=true;$('message').textContent='Cargando listas…';items=[];$('rows').replaceChildren();try{const id=$('client').value;if(!id){$('message').textContent='No hay clientes disponibles.';return;}const result=await api('/api/admin/licenses/'+encodeURIComponent(id)+'/playlists');if(ticket!==epoch)return;items=result.playlists;$('primary').textContent='Lista principal: '+result.primary.name+'. Se edita en la ficha del dispositivo.';$('message').textContent='';draw();}catch(e){if(ticket===epoch)$('message').textContent=e.message;}finally{if(ticket===epoch){busy=false;draw();}}}
$('add').onclick=()=>{if(busy||items.length>=4)return;items.push({dns_id:'',name:'',service_user:'',service_password:''});draw();};
$('client').onchange=load;$('form').onsubmit=async event=>{event.preventDefault();if(busy||save||!$('client').value)return;save=true;$('client').disabled=true;$('message').textContent='Guardando…';try{await api('/api/admin/licenses/'+encodeURIComponent($('client').value)+'/playlists',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({playlists:items})});$('message').textContent='Listas guardadas. La app las recibirá al sincronizar o abrir Cambio de lista.';items.forEach(row=>row.service_password='');}catch(e){$('message').textContent=e.message;}finally{save=false;$('client').disabled=false;await load();}};
(async()=>{try{data=await api('/api/admin/data');for(const client of data.licenses){const o=document.createElement('option');o.value=client.id;o.textContent=client.name+(client.mac?' · '+client.mac:'');$('client').append(o);}const selected=new URLSearchParams(location.search).get('cliente');if(selected&&data.licenses.some(c=>c.id===selected))$('client').value=selected;await load();}catch(e){$('message').textContent=e.message;}})();
</script></html>
